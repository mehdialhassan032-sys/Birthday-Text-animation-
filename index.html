<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Cinematic Birthday</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #020108; font-family: 'Segoe UI', sans-serif; }
        
        /* 3D Canvas */
        #c { position: fixed; inset: 0; z-index: 1; }

        /* Text Layer */
        #text-overlay {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: none; perspective: 1000px;
        }

        .text-line { 
            opacity: 0; transform: translateY(50px) rotateX(-30deg); 
            filter: blur(15px); transition: all 1.5s cubic-bezier(0.19, 1, 0.22, 1);
        }
        
        .revealed { opacity: 1 !important; transform: translateY(0) rotateX(0) !important; filter: blur(0px) !important; }

        .happy-birthday {
            font-family: 'Cinzel', serif; font-size: clamp(2rem, 8vw, 4rem);
            color: #fff; text-transform: uppercase; letter-spacing: 10px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .name-text {
            font-family: 'Montserrat', sans-serif; font-size: clamp(4rem, 15vw, 9rem);
            font-weight: 900; color: transparent;
            -webkit-text-stroke: 2px #ffd700;
            text-shadow: 0 0 30px #ffd700, 0 0 60px #ff8c00;
            margin-top: 20px;
        }

        /* UI */
        #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; text-align: center; background: rgba(0,0,0,0.8); padding: 30px; border-radius: 20px; border: 1px solid #444; }
        input { padding: 15px; border-radius: 10px; border: none; width: 250px; font-size: 1.2rem; }
        button { padding: 15px 30px; border-radius: 10px; border: none; background: #ffd700; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="ui">
    <input type="text" id="name" placeholder="Name enter karo...">
    <button onclick="start()">Start Celebration</button>
</div>

<div id="text-overlay">
    <div class="text-line happy-birthday" id="line1">Happy Birthday</div>
    <div class="text-line name-text" id="line2">NAME</div>
</div>

<canvas id="c"></canvas>

<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    function start() {
        const name = document.getElementById('name').value;
        if(!name) return;
        document.getElementById('ui').style.display = 'none';
        document.getElementById('line2').innerText = name;
        
        // Text Animation Logic
        setTimeout(() => document.getElementById('line1').classList.add('revealed'), 500);
        setTimeout(() => document.getElementById('line2').classList.add('revealed'), 1200);

        loop();
        setInterval(spawnFirework, 600); // Realistic timing
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 8 + 2;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.alpha = 1;
            this.color = color;
            this.friction = 0.95;
            this.gravity = 0.15;
        }
        update() {
            this.vx *= this.friction;
            this.vy *= this.friction;
            this.vy += this.gravity;
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.015;
        }
        draw() {
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function spawnFirework() {
        const x = Math.random() * canvas.width;
        const y = Math.random() * (canvas.height * 0.4);
        const colors = ['#FF5733', '#33FF57', '#3357FF', '#FF33A1', '#F1FF33', '#FFFFFF'];
        const color = colors[Math.floor(Math.random() * colors.length)];
        
        for (let i = 0; i < 100; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function loop() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; // Fading trail effect for realism
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        particles = particles.filter(p => p.alpha > 0);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
