<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Royal Cosmic Birthday 🎉</title>
    
    <!-- Google Fonts for Bold Royal & Modern Cyber Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Montserrat:wght@900&family=Poppins:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background: #030008; font-family: 'Montserrat', sans-serif; 
            color: #fff; 
        }

        /* Fullscreen Interactive Canvas */
        #fxCanvas { position: fixed; inset: 0; z-index: 1; }

        /* Creator Glassmorphism Screen */
        .creator-screen {
            position: absolute; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a0230 0%, #030008 100%);
            font-family: 'Poppins', sans-serif;
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(30px);
            padding: 40px 30px; border-radius: 28px; border: 1.5px solid rgba(255, 215, 0, 0.4);
            text-align: center; width: 90%; max-width: 440px;
            box-shadow: 0 0 70px rgba(186, 85, 211, 0.3);
        }

        .glass-box h2 { 
            color: #ffd700; margin-bottom: 22px; font-size: 1.6rem; 
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.7); 
            font-family: 'Cinzel Decorative', cursive; 
        }
        
        input {
            width: 100%; padding: 15px; border-radius: 30px; border: 2px solid #00f2fe;
            background: rgba(5, 0, 15, 0.9); color: #fff; font-size: 1.1rem; text-align: center; outline: none; margin-bottom: 18px;
        }
        
        button {
            background: linear-gradient(45deg, #ffd700, #ff007f, #7928ca);
            color: #fff; border: none; padding: 15px 30px; font-size: 1.05rem; font-weight: 800;
            border-radius: 30px; cursor: pointer; transition: all 0.3s; text-transform: uppercase;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.6); width: 100%;
        }
        button:hover { transform: scale(1.03); box-shadow: 0 0 45px #00f2fe; }

        #link-result { margin-top: 15px; display: none; }
        #generated-url { width: 100%; padding: 12px; background: #080015; border: 1px solid #00ffcc; color: #00ffcc; border-radius: 12px; margin-bottom: 10px; font-size: 0.85rem; word-break: break-all; }

        /* Main Wish Stage Overlay */
        #wish-stage {
            position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; text-align: center; width: 95%; pointer-events: none; display: none;
        }

        .word-container { opacity: 0; animation-fill-mode: forwards !important; margin: 4px 0; }

        /* --- ROYAL METALLIC & NEON HYBRID TYPOGRAPHY --- */
        .text-happy {
            font-family: 'Cinzel Decorative', cursive;
            font-size: clamp(2.8rem, 10vw, 5.5rem);
            font-weight: 900; letter-spacing: 6px;
            background: linear-gradient(180deg, #ffffff 0%, #ffe600 45%, #ff8c00 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.85)) drop-shadow(0 8px 15px rgba(0,0,0,0.9));
        }

        .text-birthday {
            font-family: 'Cinzel Decorative', cursive;
            font-size: clamp(2.8rem, 10vw, 5.5rem);
            font-weight: 900; letter-spacing: 6px;
            background: linear-gradient(180deg, #ffffff 0%, #ff007f 50%, #9900e6 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(255, 0, 127, 0.85)) drop-shadow(0 8px 15px rgba(0,0,0,0.9));
        }

        .text-name {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(3.8rem, 14vw, 7.5rem);
            font-weight: 900; letter-spacing: 8px; margin-top: 8px; text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #00f2fe 45%, #0066ff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 35px rgba(0, 242, 254, 0.95)) drop-shadow(0 10px 20px rgba(0,0,0,0.95));
        }

        .ornament { 
            color: #ffd700; font-size: 1.6rem; margin: 2px 0; 
            text-shadow: 0 0 15px #ffd700, 0 0 30px #ffaa00; 
            font-family: 'Cinzel Decorative', cursive;
        }

        /* Entrance Flying Animations */
        .fly-left { animation: flyLeft 1.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .fly-right { animation: flyRight 1.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .fly-up { animation: flyUp 1.5s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes flyLeft {
            0% { opacity: 0; transform: translateX(-120vw) rotate(-30deg) scale(0.2); }
            100% { opacity: 1; transform: translateX(0) rotate(0deg) scale(1); }
        }
        @keyframes flyRight {
            0% { opacity: 0; transform: translateX(120vw) rotate(30deg) scale(0.2); }
            100% { opacity: 1; transform: translateX(0) rotate(0deg) scale(1); }
        }
        @keyframes flyUp {
            0% { opacity: 0; transform: translateY(100vh) scale(0.1); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Permanent Alive Breathing Motion (Text Hata Nahi Rahega) */
        .alive-1 { opacity: 1 !important; animation: aliveWave1 4s ease-in-out infinite alternate !important; }
        .alive-2 { opacity: 1 !important; animation: aliveWave2 4.5s ease-in-out infinite alternate !important; }
        .alive-3 { opacity: 1 !important; animation: aliveWave3 3.8s ease-in-out infinite alternate !important; }

        @keyframes aliveWave1 {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-15px) scale(1.02); }
            100% { transform: translateY(5px) scale(0.99); }
        }
        @keyframes aliveWave2 {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(15px) scale(1.03); }
            100% { transform: translateY(-8px) scale(0.98); }
        }
        @keyframes aliveWave3 {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-18px) scale(1.04); }
            100% { transform: translateY(0px) scale(1); }
        }

        /* Ground Mirror Reflection */
        #stage-reflection {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 28vh;
            background: linear-gradient(to top, rgba(3, 0, 8, 0.95) 0%, transparent 100%);
            border-top: 1.5px solid rgba(255, 215, 0, 0.25);
            box-shadow: 0 -25px 80px rgba(186, 85, 211, 0.2) inset;
            pointer-events: none; z-index: 5;
        }
    </style>
</head>
<body>

    <!-- Link Generator UI -->
    <div class="creator-screen" id="creator-ui">
        <div class="glass-box">
            <h2>✨ Grand Royal Birthday</h2>
            <input type="text" id="name-input" placeholder="Enter Name Here..." />
            <button onclick="generateLink()">Create Magic Link 🚀</button>

            <div id="link-result">
                <input type="text" id="generated-url" readonly />
                <button onclick="copyLink()">Copy Magic Link 📋</button>
            </div>
        </div>
    </div>

    <!-- Main Stage Overlay -->
    <div id="wish-stage">
        <div class="word-container" id="w1">
            <span class="text-happy">HAPPY</span>
        </div>

        <div class="ornament" id="orn1" style="opacity:0;">✦ ─── ❖ ─── ✦</div>

        <div class="word-container" id="w2">
            <span class="text-birthday">BIRTHDAY</span>
        </div>

        <div class="word-container" id="w3">
            <span class="text-name" id="name-display">NAME</span>
        </div>

        <div class="ornament" id="orn2" style="opacity:0; font-size:1.2rem; margin-top:-5px;">༺ 👑 ༻</div>
    </div>

    <div id="stage-reflection"></div>

    <canvas id="fxCanvas"></canvas>

    <script>
        const canvas = document.getElementById('fxCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const nameParam = urlParams.get('name');

            if (nameParam) {
                document.getElementById('creator-ui').style.display = 'none';
                document.getElementById('wish-stage').style.display = 'block';
                document.getElementById('name-display').innerText = decodeURIComponent(nameParam);
                
                startFlyingSequence();
                startMasterEngine();
            }
        });

        function generateLink() {
            let name = document.getElementById('name-input').value.trim();
            if(!name) { alert("Please enter a name!"); return; }
            let baseUrl = window.location.href.split('?')[0];
            let shareableUrl = `${baseUrl}?name=${encodeURIComponent(name)}`;
            document.getElementById('generated-url').value = shareableUrl;
            document.getElementById('link-result').style.display = 'block';
        }

        function copyLink() {
            let copyText = document.getElementById('generated-url');
            copyText.select();
            document.execCommand("copy");
            alert("Magic Link Copied! Share with the Birthday Person 🎉");
        }

        // Entrance Flying Sequence -> Shift to Permanent Alive Floating
        function startFlyingSequence() {
            const w1 = document.getElementById('w1');
            const w2 = document.getElementById('w2');
            const w3 = document.getElementById('w3');
            const orn1 = document.getElementById('orn1');
            const orn2 = document.getElementById('orn2');

            setTimeout(() => { w1.classList.add('fly-left'); }, 300);

            setTimeout(() => { 
                w2.classList.add('fly-right'); 
                orn1.style.opacity = '1';
            }, 1000);

            setTimeout(() => { 
                w3.classList.add('fly-up'); 
                orn2.style.opacity = '1';
            }, 1800);

            // Forever Alive Transition (Text stays permanently)
            setTimeout(() => {
                w1.className = 'word-container alive-1';
                w2.className = 'word-container alive-2';
                w3.className = 'word-container alive-3';
            }, 3000);
        }

        // --- MASTER ENGINE: GALAXY NEBULA + MASSIVE ROCKET BOMBS + STAR BURSTS ---
        function startMasterEngine() {
            let rockets = [];
            let particles = [];
            let textStars = [];
            let spaceStars = [];

            // Background Deep Cosmic Stars
            for(let i=0; i<150; i++) {
                spaceStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.4 + 0.1,
                    alpha: Math.random()
                });
            }

            // MASSIVE ROCKET BOMB CLASS
            class MassiveRocket {
                constructor() {
                    this.x = Math.random() * (canvas.width * 0.8) + (canvas.width * 0.1);
                    this.y = canvas.height + 20;
                    this.targetY = Math.random() * (canvas.height * 0.45) + 40;
                    this.speed = Math.random() * 4 + 9;
                    this.size = Math.random() * 3 + 4; // Bada Rocket Head
                    const colorPalette = ['#ffd700', '#ff007f', '#00f2fe', '#ff5500', '#a855f7', '#00ffaa'];
                    this.color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                    this.trail = [];
                }
                update() {
                    this.trail.push({ x: this.x, y: this.y, alpha: 1 });
                    if(this.trail.length > 15) this.trail.shift();

                    this.y -= this.speed;

                    if (this.y <= this.targetY) {
                        triggerGrandExplosion(this.x, this.y, this.color);
                        return false;
                    }
                    return true;
                }
                draw() {
                    // Rocket Trail Sparks
                    this.trail.forEach((t, index) => {
                        ctx.save();
                        ctx.globalAlpha = (index / this.trail.length) * 0.8;
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.arc(t.x, t.y, this.size * (index / this.trail.length), 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    });

                    // Massive Head
                    ctx.save();
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // GRAND FIREWORK EXPLOSION PARTICLES (Double Ring Burst)
            class ExplosionParticle {
                constructor(x, y, color, isInnerRing = false) {
                    this.x = x; this.y = y; this.color = color;
                    const angle = Math.random() * Math.PI * 2;
                    const speed = isInnerRing ? (Math.random() * 4 + 1) : (Math.random() * 10 + 3);
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.alpha = 1;
                    this.decay = Math.random() * 0.015 + 0.008;
                    this.gravity = 0.06;
                    this.size = Math.random() * 3 + 1.5;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += this.gravity;
                    this.vx *= 0.98;
                    this.vy *= 0.98;
                    this.alpha -= this.decay;
                    return this.alpha > 0;
                }
                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // CONTINUOUS STAR DUST EMITTING FROM TEXT
            class TextStarEmitter {
                constructor() {
                    const bounds = document.getElementById('wish-stage').getBoundingClientRect();
                    this.x = bounds.left + Math.random() * bounds.width;
                    this.y = bounds.top + Math.random() * bounds.height;
                    this.size = Math.random() * 3.5 + 1.5;
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = (Math.random() - 0.5) * 2 - 1;
                    this.alpha = 1;
                    this.color = Math.random() > 0.5 ? '#ffd700' : '#00f2fe';
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    this.alpha -= 0.012;
                    return this.alpha > 0;
                }
                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            function triggerGrandExplosion(x, y, color) {
                // Outer Heavy Burst
                for (let i = 0; i < 90; i++) {
                    particles.push(new ExplosionParticle(x, y, color, false));
                }
                // Inner White Glow Core Burst
                for (let i = 0; i < 40; i++) {
                    particles.push(new ExplosionParticle(x, y, '#ffffff', true));
                }
            }

            // Launch Massive Rocket Bombs at regular interval
            setInterval(() => { 
                rockets.push(new MassiveRocket()); 
            }, 320);

            // Continuously emit stars around text
            setInterval(() => {
                if(document.getElementById('wish-stage').style.display === 'block') {
                    for(let i=0; i<4; i++) textStars.push(new TextStarEmitter());
                }
            }, 90);

            function mainLoop() {
                requestAnimationFrame(mainLoop);
                
                // Cosmic Trail Clear Effect
                ctx.fillStyle = 'rgba(3, 0, 8, 0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw Space Cosmic Background Stars
                spaceStars.forEach(s => {
                    s.y -= s.speed;
                    if(s.y < 0) s.y = canvas.height;
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(Math.sin(Date.now()*0.002 + s.x))})`;
                    ctx.fillRect(s.x, s.y, s.size, s.size);
                });

                // Update & Render Rockets, Fireworks, Stars
                rockets = rockets.filter(r => { r.draw(); return r.update(); });
                particles = particles.filter(p => { p.draw(); return p.update(); });
                textStars = textStars.filter(s => { s.draw(); return s.update(); });
            }
            mainLoop();
        }
    </script>
</body>
</html>
