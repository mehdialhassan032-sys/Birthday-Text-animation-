<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cinematic Neon Birthday Surprise 🎉</title>
    
    <!-- Google Fonts for Bold 3D Neon Look -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background: #030108; font-family: 'Anton', sans-serif; 
            color: #fff; 
        }

        /* Fullscreen Fireworks & Canvas */
        #fireworksCanvas { position: fixed; inset: 0; z-index: 1; }

        /* UI Screen for Link Generator */
        .creator-screen {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
            background: radial-gradient(circle, #220336 0%, #030108 100%);
            font-family: 'Poppins', sans-serif;
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px);
            padding: 35px 25px; border-radius: 24px; border: 1.5px solid rgba(255, 0, 127, 0.4);
            text-align: center; width: 90%; max-width: 420px;
            box-shadow: 0 0 50px rgba(255, 0, 127, 0.3);
        }

        .glass-box h2 { color: #ffd700; margin-bottom: 20px; font-size: 1.5rem; text-shadow: 0 0 10px #ffd700; }
        input {
            width: 100%; padding: 14px; border-radius: 30px; border: 2px solid #00ffff;
            background: rgba(0,0,0,0.8); color: #fff; font-size: 1.1rem; text-align: center; outline: none; margin-bottom: 15px;
        }
        button {
            background: linear-gradient(45deg, #ff007f, #ff7700, #ffd700);
            color: #fff; border: none; padding: 13px 30px; font-size: 1rem; font-weight: 800;
            border-radius: 30px; cursor: pointer; transition: all 0.3s; text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
        }
        button:hover { transform: scale(1.05); box-shadow: 0 0 30px #00ffff; }

        #link-result { margin-top: 15px; display: none; }
        #generated-url { width: 100%; padding: 10px; background: #080015; border: 1px solid #00ffcc; color: #00ffcc; border-radius: 10px; margin-bottom: 10px; font-size: 0.85rem; word-break: break-all; }

        /* Main Display Screen Container */
        #wish-container {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; text-align: center; width: 95%; pointer-events: none; display: none;
        }

        /* --- 3D NEON TEXT STYLING (Image Exact Match) --- */
        .neon-wrapper { position: relative; display: inline-block; margin: 2px 0; }

        /* 1. HAPPY (Gold/Orange 3D Neon) */
        .text-happy {
            font-size: clamp(2.8rem, 10vw, 5.5rem);
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 
                /* Inner Tube Glow */
                0 0 5px #fff, 0 0 10px #fff,
                /* 3D Extrusion Side Depth */
                0 1px 0 #cc6600, 0 2px 0 #b35900, 0 3px 0 #994d00, 0 4px 0 #804000, 0 5px 0 #663300, 0 6px 0 #4d2600,
                0 8px 15px rgba(0,0,0,0.9),
                /* Neon Glow Aura */
                0 0 20px #ff9900, 0 0 40px #ff6600, 0 0 70px #ff3300;
        }

        /* 2. BIRTHDAY (Magenta/Pink 3D Neon) */
        .text-birthday {
            font-size: clamp(2.8rem, 10vw, 5.5rem);
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 
                0 0 5px #fff, 0 0 10px #fff,
                0 1px 0 #b30059, 0 2px 0 #99004d, 0 3px 0 #800040, 0 4px 0 #660033, 0 5px 0 #4d0026,
                0 8px 15px rgba(0,0,0,0.9),
                0 0 20px #ff007f, 0 0 40px #ff0055, 0 0 70px #d0006f;
        }

        /* 3. NAME (Cyan/Electric Blue 3D Neon) */
        .text-name {
            font-size: clamp(3.5rem, 13vw, 7rem);
            letter-spacing: 5px;
            color: #fff;
            margin-top: 10px;
            text-shadow: 
                0 0 5px #fff, 0 0 12px #fff,
                0 1px 0 #0088cc, 0 2px 0 #0077b3, 0 3px 0 #006699, 0 4px 0 #005580, 0 5px 0 #004466, 0 6px 0 #00334d,
                0 10px 20px rgba(0,0,0,0.95),
                0 0 25px #00ffff, 0 0 50px #00bfff, 0 0 90px #0066ff;
        }

        /* Golden Ornament Divider & Flourish */
        .ornament {
            color: #ffd700; font-size: 1.5rem; margin: 5px 0;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ffaa00;
        }
        .heart-flourish {
            color: #ff007f; font-size: 2rem; margin-top: -5px;
            text-shadow: 0 0 15px #ff007f, 0 0 30px #ff0055;
        }

        /* --- FLYING ENTRANCE ANIMATIONS (Word by Word) --- */
        .word-container { opacity: 0; }

        .fly-in-top-left { animation: flyTopLeft 1.2s cubic-bezier(0.25, 1, 0.5, 1) FORWARDS; }
        .fly-in-top-right { animation: flyTopRight 1.2s cubic-bezier(0.25, 1, 0.5, 1) FORWARDS; }
        .fly-in-bottom { animation: flyBottom 1.4s cubic-bezier(0.25, 1, 0.5, 1) FORWARDS; }

        @keyframes flyTopLeft {
            0% { opacity: 0; transform: translate(-100vw, -100vh) rotate(-45deg) scale(0.2); }
            100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
        }

        @keyframes flyTopRight {
            0% { opacity: 0; transform: translate(100vw, -100vh) rotate(45deg) scale(0.2); }
            100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
        }

        @keyframes flyBottom {
            0% { opacity: 0; transform: translate(0, 100vh) scale(0.1); }
            100% { opacity: 1; transform: translate(0, 0) scale(1); }
        }

        /* Continuous Slow Wave Floating Effect after landing */
        .floating-wave {
            animation: floatMotion 3.5s ease-in-out infinite alternate !important;
        }

        @keyframes floatMotion {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1deg); }
            100% { transform: translateY(0px) rotate(-1deg); }
        }

        /* --- SPARKLING STARS EFFECT ON TEXT --- */
        .star-sparkle {
            position: absolute; width: 12px; height: 12px;
            background: radial-gradient(circle, #fff 30%, transparent 70%);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: starTwinkle 1.2s ease-in-out infinite alternate;
            pointer-events: none; z-index: 15;
        }

        @keyframes starTwinkle {
            0% { transform: scale(0.2) rotate(0deg); opacity: 0.1; }
            100% { transform: scale(1.5) rotate(180deg); opacity: 1; filter: drop-shadow(0 0 10px #fff); }
        }

        /* --- WET FLOOR REFLECTION EFFECT --- */
        #floor-reflection {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 25vh;
            background: linear-gradient(to top, rgba(3, 1, 8, 0.9) 0%, transparent 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 -20px 50px rgba(0, 255, 255, 0.15) inset;
            pointer-events: none; z-index: 5;
        }
    </style>
</head>
<body>

    <!-- Generator UI -->
    <div class="creator-screen" id="creator-ui">
        <div class="glass-box">
            <h2>3D Neon Wish Generator 🎉</h2>
            <input type="text" id="name-input" placeholder="Enter Name Here..." />
            <button onclick="generateLink()">Create Magic Link 🚀</button>

            <div id="link-result">
                <input type="text" id="generated-url" readonly />
                <button onclick="copyLink()">Copy Magic Link 📋</button>
            </div>
        </div>
    </div>

    <!-- Main Display Overlay -->
    <div id="wish-container">
        <!-- Word 1: Fly From Top-Left -->
        <div class="word-container" id="w1">
            <span class="neon-wrapper text-happy" id="text-h">HAPPY</span>
        </div>

        <!-- Word 2: Fly From Top-Right -->
        <div class="word-container" id="w2">
            <span class="neon-wrapper text-birthday" id="text-b">BIRTHDAY</span>
        </div>

        <div class="ornament" id="orn1" style="opacity:0;">✦ ─── ★ ─── ✦</div>

        <!-- Word 3: Fly From Bottom -->
        <div class="word-container" id="w3">
            <span class="neon-wrapper text-name" id="text-n">NAME</span>
        </div>

        <div class="heart-flourish" id="orn2" style="opacity:0;">༺ 🌸 ༻</div>
    </div>

    <!-- Wet Ground Floor Reflection Layer -->
    <div id="floor-reflection"></div>

    <canvas id="fireworksCanvas"></canvas>

    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const nameParam = urlParams.get('name');

            if (nameParam) {
                document.getElementById('creator-ui').style.display = 'none';
                document.getElementById('wish-container').style.display = 'block';
                document.getElementById('text-n').innerText = decodeURIComponent(nameParam);
                
                // Start Flying Word Animations & Fireworks
                startFlyingSequence();
                initFireworksEngine();
            }
        });

        function generateLink() {
            let name = document.getElementById('name-input').value.trim();
            if(!name) { alert("Please enter a name!"); return; }
            let baseUrl = window.location.href.split('?')[0];
            let shareableUrl = `${baseUrl}?name=${encodeURIComponent(name)}`;
            document.getElementById('generated-url').value = shareableUrl;
            document.getElementById('link-result').style.display = 'block';
        }

        function copyLink() {
            let copyText = document.getElementById('generated-url');
            copyText.select();
            document.execCommand("copy");
            alert("Magic Link Copied! Share with the Birthday Person 🎉");
        }

        // --- WORD BY WORD FLYING SEQUENCE & STARS ATTACHMENT ---
        function startFlyingSequence() {
            const w1 = document.getElementById('w1');
            const w2 = document.getElementById('w2');
            const w3 = document.getElementById('w3');
            const orn1 = document.getElementById('orn1');
            const orn2 = document.getElementById('orn2');

            // Step 1: HAPPY flies in from Top-Left
            setTimeout(() => {
                w1.classList.add('fly-in-top-left');
                addStarsToElement('text-h', 5);
            }, 300);

            // Step 2: BIRTHDAY flies in from Top-Right
            setTimeout(() => {
                w2.classList.add('fly-in-top-right');
                addStarsToElement('text-b', 6);
            }, 1000);

            // Step 3: NAME flies in from Bottom
            setTimeout(() => {
                w3.classList.add('fly-in-bottom');
                addStarsToElement('text-n', 8);
                orn1.style.opacity = '1';
                orn2.style.opacity = '1';
            }, 1800);

            // Step 4: Convert all to continuous smooth floating wave motion
            setTimeout(() => {
                [w1, w2, w3].forEach(el => {
                    el.classList.add('floating-wave');
                });
            }, 3200);
        }

        // Dynamically add sparkling stars on text letters
        function addStarsToElement(elementId, count) {
            const parent = document.getElementById(elementId);
            for(let i = 0; i < count; i++) {
                let star = document.createElement('div');
                star.className = 'star-sparkle';
                star.style.top = (Math.random() * 80 + 5) + '%';
                star.style.left = (Math.random() * 90 + 5) + '%';
                star.style.animationDelay = (Math.random() * 1.2) + 's';
                parent.appendChild(star);
            }
        }

        // --- DENSE RICH FIREWORKS SYSTEM ---
        function initFireworksEngine() {
            let particles = [];
            let rockets = [];

            class Rocket {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height;
                    this.targetY = Math.random() * (canvas.height * 0.5) + 40;
                    this.speed = Math.random() * 3 + 7;
                    // Colors matching image: Gold, Magenta, Cyan
                    const colorChoices = ['#ffd700', '#ff007f', '#00ffff', '#ff5500', '#00ffaa'];
                    this.color = colorChoices[Math.floor(Math.random() * colorChoices.length)];
                }
                update() {
                    this.y -= this.speed;
                    if (this.y <= this.targetY) {
                        explode(this.x, this.y, this.color);
                        return false;
                    }
                    return true;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
            }

            class Particle {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 8 + 1;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.alpha = 1;
                    this.decay = Math.random() * 0.018 + 0.01;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.05; // Gravity
                    this.alpha -= this.decay;
                    return this.alpha > 0;
                }
                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 2.8, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.restore();
                }
            }

            function explode(x, y, color) {
                for (let i = 0; i < 70; i++) {
                    particles.push(new Particle(x, y, color));
                }
            }

            setInterval(() => { rockets.push(new Rocket()); }, 280);

            function render() {
                requestAnimationFrame(render);
                ctx.fillStyle = 'rgba(3, 1, 8, 0.22)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                rockets = rockets.filter(r => { r.draw(); return r.update(); });
                particles = particles.filter(p => { p.draw(); return p.update(); });
            }
            render();
        }
    </script>
</body>
</html>
