<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Cosmic Birthday ✨</title>
    
    <!-- Ultra Bold Modern Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    
    <style>
        /* Base Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background: #05010d; font-family: 'Righteous', cursive; 
            color: #fff; 
        }

        /* Interactive Cosmic Canvas */
        #bgCanvas { position: fixed; inset: 0; z-index: 1; }

        /* Modern Glassmorphism Creator Screen */
        .creator-screen {
            position: absolute; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1b0736 0%, #05010d 100%);
            font-family: 'Poppins', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 215, 0, 0.35);
            padding: 40px 30px; border-radius: 28px;
            text-align: center; width: 90%; max-width: 420px;
            box-shadow: 0 0 60px rgba(186, 85, 211, 0.25);
        }

        .glass-card h2 {
            color: #ffd700; font-size: 1.6rem; margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        input {
            width: 100%; padding: 15px; border-radius: 50px;
            border: 2px solid #a855f7; background: rgba(10, 2, 25, 0.85);
            color: #fff; font-size: 1.05rem; text-align: center; outline: none; margin-bottom: 18px;
        }

        button {
            width: 100%; padding: 15px; border-radius: 50px; border: none;
            background: linear-gradient(135deg, #ffd700, #ff007f, #7928ca);
            color: #fff; font-size: 1.05rem; font-weight: 800; cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.5); text-transform: uppercase;
        }
        button:hover { transform: scale(1.03); box-shadow: 0 0 40px rgba(255, 215, 0, 0.8); }

        #link-box { margin-top: 15px; display: none; }
        #share-url { 
            width: 100%; padding: 12px; background: #0c041c; 
            border: 1px solid #00f2fe; color: #00f2fe; border-radius: 12px; 
            margin-bottom: 12px; font-size: 0.85rem; word-break: break-all; 
        }

        /* Wish Animation Overlay */
        #wish-stage {
            position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; text-align: center; width: 92%; pointer-events: none; display: none;
        }

        .word-box { opacity: 0; animation-fill-mode: forwards !important; margin: 6px 0; }

        /* Metallic Glow Typography */
        .text-happy {
            font-size: clamp(3rem, 11vw, 5.5rem);
            background: linear-gradient(180deg, #ffffff 0%, #ffd700 60%, #ff8c00 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.8));
            letter-spacing: 6px;
        }

        .text-birthday {
            font-size: clamp(3rem, 11vw, 5.5rem);
            background: linear-gradient(180deg, #ffffff 0%, #ff007f 60%, #9900e6 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(255, 0, 127, 0.8));
            letter-spacing: 6px;
        }

        .text-name {
            font-size: clamp(3.8rem, 14vw, 7rem);
            background: linear-gradient(180deg, #ffffff 0%, #00f2fe 50%, #4facfe 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 35px rgba(0, 242, 254, 0.9));
            letter-spacing: 8px; margin-top: 10px;
        }

        /* Curve Flying Entrance Animations */
        .fly-left { animation: flyLeft 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .fly-right { animation: flyRight 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .fly-up { animation: flyUp 1.4s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes flyLeft {
            0% { opacity: 0; transform: translateX(-120vw) rotate(-20deg) scale(0.3); }
            100% { opacity: 1; transform: translateX(0) rotate(0deg) scale(1); }
        }
        @keyframes flyRight {
            0% { opacity: 0; transform: translateX(120vw) rotate(20deg) scale(0.3); }
            100% { opacity: 1; transform: translateX(0) rotate(0deg) scale(1); }
        }
        @keyframes flyUp {
            0% { opacity: 0; transform: translateY(100vh) scale(0.2); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Permanent Living Motion (Never Disappears) */
        .alive-1 { opacity: 1 !important; animation: alive1 4s ease-in-out infinite alternate !important; }
        .alive-2 { opacity: 1 !important; animation: alive2 4.5s ease-in-out infinite alternate !important; }
        .alive-3 { opacity: 1 !important; animation: alive3 3.8s ease-in-out infinite alternate !important; }

        @keyframes alive1 {
            0% { transform: translateY(0px) rotate(0deg); filter: drop-shadow(0 0 20px rgba(255,215,0,0.8)); }
            100% { transform: translateY(-16px) rotate(1.5deg); filter: drop-shadow(0 0 35px rgba(255,215,0,1)); }
        }
        @keyframes alive2 {
            0% { transform: translateY(0px) rotate(0deg); filter: drop-shadow(0 0 20px rgba(255,0,127,0.8)); }
            100% { transform: translateY(14px) rotate(-1.5deg); filter: drop-shadow(0 0 35px rgba(255,0,127,1)); }
        }
        @keyframes alive3 {
            0% { transform: translateY(0px) scale(1); filter: drop-shadow(0 0 25px rgba(0,242,254,0.8)); }
            100% { transform: translateY(-18px) scale(1.03); filter: drop-shadow(0 0 45px rgba(0,242,254,1)); }
        }
    </style>
</head>
<body>

    <!-- Link Generator UI -->
    <div class="creator-screen" id="creator-ui">
        <div class="glass-card">
            <h2>✨ Cosmic Birthday Creator</h2>
            <input type="text" id="name-input" placeholder="Enter Birthday Name..." />
            <button onclick="createLink()">Generate Magic Link 🚀</button>

            <div id="link-box">
                <input type="text" id="share-url" readonly />
                <button onclick="copyLink()">Copy Link 📋</button>
            </div>
        </div>
    </div>

    <!-- Main Stage Container -->
    <div id="wish-stage">
        <div class="word-box" id="w1">
            <span class="text-happy">HAPPY</span>
        </div>
        <div class="word-box" id="w2">
            <span class="text-birthday">BIRTHDAY</span>
        </div>
        <div class="word-box" id="w3">
            <span class="text-name" id="name-display">NAME</span>
        </div>
    </div>

    <canvas id="bgCanvas"></canvas>

    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        document.addEventListener("DOMContentLoaded", function() {
            const params = new URLSearchParams(window.location.search);
            const name = params.get('name');

            if (name) {
                document.getElementById('creator-ui').style.display = 'none';
                document.getElementById('wish-stage').style.display = 'block';
                document.getElementById('name-display').innerText = decodeURIComponent(name);
                
                triggerSequence();
                startEngine();
            }
        });

        function createLink() {
            let val = document.getElementById('name-input').value.trim();
            if(!val) { alert("Please enter a name!"); return; }
            let link = `${window.location.href.split('?')[0]}?name=${encodeURIComponent(val)}`;
            document.getElementById('share-url').value = link;
            document.getElementById('link-box').style.display = 'block';
        }

        function copyLink() {
            let field = document.getElementById('share-url');
            field.select();
            document.execCommand("copy");
            alert("Magic Link Copied! 🎉");
        }

        // Sequence: Curve Flying Entrance -> Infinite Alive Floating Mode
        function triggerSequence() {
            const w1 = document.getElementById('w1');
            const w2 = document.getElementById('w2');
            const w3 = document.getElementById('w3');

            setTimeout(() => { w1.classList.add('fly-left'); }, 200);
            setTimeout(() => { w2.classList.add('fly-right'); }, 900);
            setTimeout(() => { w3.classList.add('fly-up'); }, 1600);

            // Shift to Infinite Living Motion (Text remains forever)
            setTimeout(() => {
                w1.className = 'word-box alive-1';
                w2.className = 'word-box alive-2';
                w3.className = 'word-box alive-3';
            }, 2800);
        }

        // Canvas Engine: Space Particles + Fireworks + Star Emitters from Text
        function startEngine() {
            let fireworks = [];
            let stars = [];

            // Background Rising Cosmic Dust
            for(let i=0; i<120; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.5 + 0.2,
                    alpha: Math.random()
                });
            }

            // Star Burst Particle Emitter (Emits continuously from text)
            class StarEmitter {
                constructor() {
                    const bounds = document.getElementById('wish-stage').getBoundingClientRect();
                    this.x = bounds.left + Math.random() * bounds.width;
                    this.y = bounds.top + Math.random() * bounds.height;
                    this.vx = (Math.random() - 0.5) * 3;
                    this.vy = (Math.random() - 0.5) * 3 - 1;
                    this.size = Math.random() * 4 + 1;
                    this.alpha = 1;
                    this.color = Math.random() > 0.5 ? '#ffd700' : '#00f2fe';
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    this.alpha -= 0.015;
                    return this.alpha > 0;
                }
                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            let textStars = [];

            function animate() {
                requestAnimationFrame(animate);
                ctx.fillStyle = 'rgba(5, 1, 13, 0.25)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw Cosmic Background Stars
                stars.forEach(s => {
                    s.y -= s.speed;
                    if(s.y < 0) s.y = canvas.height;
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.sin(Date.now()*0.003 + s.x)})`;
                    ctx.fillRect(s.x, s.y, s.size, s.size);
                });

                // Spawn Stars From Text
                if(document.getElementById('wish-stage').style.display === 'block') {
                    for(let i=0; i<3; i++) textStars.push(new StarEmitter());
                }

                textStars = textStars.filter(st => { st.draw(); return st.update(); });
            }
            animate();
        }
    </script>
</body>
</html>
