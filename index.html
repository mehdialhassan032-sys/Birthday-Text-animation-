<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Flying Birthday Magic ✨</title>
    
    <!-- Google Fonts for Neon Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Poppins:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #030008; font-family: 'Poppins', sans-serif; color: #fff; }

        /* Fullscreen Canvas for Background & Fireworks */
        #fireworksCanvas { position: fixed; inset: 0; z-index: 1; }

        /* Generator UI Screen */
        .center-box {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
            background: radial-gradient(circle, #1a0033 0%, #030008 100%);
        }

        .glass-ui {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            padding: 35px 25px; border-radius: 20px; border: 1.5px solid rgba(255, 0, 127, 0.4);
            text-align: center; width: 90%; max-width: 400px;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.3);
        }

        .glass-ui h2 {
            color: #ffd700; margin-bottom: 20px; font-size: 1.5rem;
            text-shadow: 0 0 10px #ffd700;
        }

        input {
            width: 100%; padding: 14px; border-radius: 30px; border: 2px solid #00ffff;
            background: rgba(0,0,0,0.7); color: #fff; font-size: 1.1rem; text-align: center; outline: none; margin-bottom: 15px;
        }

        button {
            background: linear-gradient(45deg, #ff007f, #ff7700, #ffd700);
            color: #fff; border: none; padding: 13px 30px; font-size: 1rem; font-weight: 800;
            border-radius: 30px; cursor: pointer; transition: all 0.3s; text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
        }
        button:hover { transform: scale(1.05); box-shadow: 0 0 30px #00ffff; }

        #link-result { margin-top: 15px; display: none; }
        #generated-url { width: 100%; padding: 10px; background: #0a0015; border: 1px solid #00ffcc; color: #00ffcc; border-radius: 10px; margin-bottom: 10px; font-size: 0.85rem; word-break: break-all; }

        /* Main Display Screen */
        #wish-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; text-align: center; width: 90%; pointer-events: none; display: none;
        }

        /* Neon Typography with Star Effects */
        .neon-word {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.2rem, 7vw, 4.5rem);
            font-weight: 900;
            display: inline-block;
            margin: 5px 0;
            position: relative;
            opacity: 0;
            text-transform: uppercase;
        }

        /* 3D Gold/Orange Neon for HAPPY */
        .word-happy {
            color: #fff;
            text-shadow: 
                0 0 5px #fff, 0 0 10px #ffaa00, 0 0 20px #ffaa00, 
                0 0 40px #ff7700, 0 0 80px #ff4500;
        }

        /* 3D Pink Neon for BIRTHDAY */
        .word-birthday {
            color: #fff;
            text-shadow: 
                0 0 5px #fff, 0 0 10px #ff007f, 0 0 20px #ff007f, 
                0 0 40px #ff0055, 0 0 80px #d0006f;
        }

        /* 3D Cyan Neon for NAME */
        .word-name {
            font-size: clamp(3rem, 11vw, 6rem);
            color: #fff;
            text-shadow: 
                0 0 5px #fff, 0 0 10px #00ffff, 0 0 20px #00ffff, 
                0 0 40px #00bfff, 0 0 80px #0077ff;
            margin-top: 15px;
        }

        /* Flying Animations */
        .fly-from-left { animation: flyLeft 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) FORWARDS; }
        .fly-from-right { animation: flyRight 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) FORWARDS; }
        .fly-from-bottom { animation: flyBottom 1.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) FORWARDS; }

        @keyframes flyLeft {
            0% { opacity: 0; transform: translateX(-100vw) scale(0.2) rotate(-30deg); }
            100% { opacity: 1; transform: translateX(0) scale(1) rotate(0deg); }
        }

        @keyframes flyRight {
            0% { opacity: 0; transform: translateX(100vw) scale(0.2) rotate(30deg); }
            100% { opacity: 1; transform: translateX(0) scale(1) rotate(0deg); }
        }

        @keyframes flyBottom {
            0% { opacity: 0; transform: translateY(100vh) scale(0.1); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Continuous Floating Wave */
        .continuous-float {
            animation: floatGlow 3s ease-in-out infinite alternate !important;
        }

        @keyframes floatGlow {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-15px) scale(1.03); }
            100% { transform: translateY(0px) scale(1); }
        }

        /* Sparkling Stars Effect Element */
        .star-sparkle {
            position: absolute;
            width: 10px; height: 10px;
            background: radial-gradient(circle, #fff 20%, transparent 70%);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: starTwinkle 1s infinite alternate;
            pointer-events: none;
        }

        @keyframes starTwinkle {
            0% { transform: scale(0.3) rotate(0deg); opacity: 0.2; }
            100% { transform: scale(1.4) rotate(180deg); opacity: 1; filter: drop-shadow(0 0 8px #fff); }
        }
    </style>
</head>
<body>

    <!-- Link Creator Screen -->
    <div class="center-box" id="creator-ui">
        <div class="glass-ui">
            <h2>Birthday Magic Generator 🎉</h2>
            <input type="text" id="name-input" placeholder="Enter Name Here..." />
            <button onclick="generateLink()">Create Magic Link 🚀</button>

            <div id="link-result">
                <input type="text" id="generated-url" readonly />
                <button onclick="copyLink()">Copy Share Link 📋</button>
            </div>
        </div>
    </div>

    <!-- Main Animated Wish Overlay -->
    <div id="wish-container">
        <div><span class="neon-word word-happy" id="word1">HAPPY</span></div>
        <div><span class="neon-word word-birthday" id="word2">BIRTHDAY</span></div>
        <div><span class="neon-word word-name" id="word3">NAME</span></div>
    </div>

    <canvas id="fireworksCanvas"></canvas>

    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const nameParam = urlParams.get('name');

            if (nameParam) {
                document.getElementById('creator-ui').style.display = 'none';
                document.getElementById('wish-container').style.display = 'block';
                document.getElementById('word3').innerText = decodeURIComponent(nameParam);
                
                // Trigger Flying Word Sequences
                triggerFlyingEntrance();
                initFireworksEngine();
            }
        });

        function generateLink() {
            let name = document.getElementById('name-input').value.trim();
            if(!name) { alert("Please enter a name!"); return; }
            let baseUrl = window.location.href.split('?')[0];
            let shareableUrl = `${baseUrl}?name=${encodeURIComponent(name)}`;
            document.getElementById('generated-url').value = shareableUrl;
            document.getElementById('link-result').style.display = 'block';
        }

        function copyLink() {
            let copyText = document.getElementById('generated-url');
            copyText.select();
            document.execCommand("copy");
            alert("Magic Link Copied! Share with the Birthday Person 🎉");
        }

        // --- FLYING ENTRANCE & STARS SYSTEM ---
        function triggerFlyingEntrance() {
            const w1 = document.getElementById('word1');
            const w2 = document.getElementById('word2');
            const w3 = document.getElementById('word3');

            // Word 1 Fly Left
            setTimeout(() => {
                w1.classList.add('fly-from-left');
                attachStars(w1);
            }, 300);

            // Word 2 Fly Right
            setTimeout(() => {
                w2.classList.add('fly-from-right');
                attachStars(w2);
            }, 1000);

            // Word 3 Fly Bottom
            setTimeout(() => {
                w3.classList.add('fly-from-bottom');
                attachStars(w3);
            }, 1800);

            // Switch to continuous floating glow after animations finish
            setTimeout(() => {
                [w1, w2, w3].forEach(el => {
                    el.className += ' continuous-float';
                });
            }, 3200);
        }

        function attachStars(element) {
            for(let i = 0; i < 6; i++) {
                let star = document.createElement('div');
                star.className = 'star-sparkle';
                star.style.top = Math.random() * 80 + '%';
                star.style.left = Math.random() * 90 + '%';
                star.style.animationDelay = (Math.random() * 1) + 's';
                element.appendChild(star);
            }
        }

        // --- HIGH QUALITY FIREWORKS SYSTEM ---
        function initFireworksEngine() {
            let particles = [];
            let rockets = [];

            class Rocket {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height;
                    this.targetY = Math.random() * (canvas.height * 0.55) + 40;
                    this.speed = Math.random() * 3 + 7;
                    this.color = `hsl(${Math.random() * 360}, 100%, 65%)`;
                }
                update() {
                    this.y -= this.speed;
                    if (this.y <= this.targetY) {
                        explode(this.x, this.y, this.color);
                        return false;
                    }
                    return true;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
            }

            class Particle {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 7 + 1;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.alpha = 1;
                    this.decay = Math.random() * 0.02 + 0.012;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.06;
                    this.alpha -= this.decay;
                    return this.alpha > 0;
                }
                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.restore();
                }
            }

            function explode(x, y, color) {
                for (let i = 0; i < 65; i++) {
                    particles.push(new Particle(x, y, color));
                }
            }

            setInterval(() => { rockets.push(new Rocket()); }, 300);

            function animate() {
                requestAnimationFrame(animate);
                ctx.fillStyle = 'rgba(3, 0, 8, 0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                rockets = rockets.filter(r => { r.draw(); return r.update(); });
                particles = particles.filter(p => { p.draw(); return p.update(); });
            }
            animate();
        }
    </script>
</body>
</html>
