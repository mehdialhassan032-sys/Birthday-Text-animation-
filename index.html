<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Celebration — Live Fireworks</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,900&family=Poppins:wght@300;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#050211; --bg-mid:#0b0420;
    --gold:#f4d58d; --gold-bright:#ffe9b0; --cream:#fff6e0;
    --ember:#ff6b35; --ink:#0a0614;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-deep);font-family:'Poppins',sans-serif;color:#fff;}

  #webgl-container{position:fixed;inset:0;z-index:1;}

  .creator-screen{
    position:absolute;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 30%, #1a0f36 0%, var(--bg-deep) 70%);
  }
  .glass-box{
    width:90%;max-width:420px;padding:44px 34px;border-radius:22px;
    background:rgba(255,255,255,0.03);backdrop-filter:blur(20px);
    border:1px solid rgba(244,213,141,0.25);
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    text-align:center;
  }
  .glass-box .eyebrow{
    font-size:0.7rem;letter-spacing:4px;text-transform:uppercase;
    color:var(--gold);opacity:0.7;margin-bottom:10px;font-weight:600;
  }
  .glass-box h2{
    font-family:'Playfair Display',serif;font-style:italic;font-weight:700;
    font-size:1.6rem;color:var(--cream);margin-bottom:26px;
  }
  input{
    width:100%;padding:14px 16px;border-radius:12px;
    border:1px solid rgba(244,213,141,0.35);
    background:rgba(0,0,0,0.35);color:#fff;font-size:1rem;
    text-align:center;outline:none;margin-bottom:16px;font-family:'Poppins',sans-serif;
  }
  input::placeholder{color:rgba(255,255,255,0.4);}
  button{
    width:100%;padding:14px 26px;border:none;border-radius:12px;cursor:pointer;
    font-family:'Poppins',sans-serif;font-weight:600;font-size:0.95rem;letter-spacing:0.5px;
    background:linear-gradient(135deg,var(--gold) 0%,var(--ember) 100%);
    color:var(--ink);transition:transform .25s ease, box-shadow .25s ease;
    box-shadow:0 8px 24px rgba(255,107,53,0.25);
  }
  button:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,107,53,0.4);}
  #link-result{margin-top:14px;display:none;}
  #generated-url{
    font-family:'Poppins',sans-serif;font-size:0.75rem;
    border:1px solid rgba(244,213,141,0.3);color:var(--gold);
    background:rgba(0,0,0,0.4);word-break:break-all;
  }

  #wish-stage{
    position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);
    z-index:10;text-align:center;width:95%;pointer-events:none;display:none;
  }
  .line{margin:2px 0;}

  .word{
    display:inline-block;opacity:0;filter:blur(14px);
    transform:translateY(28px);
    animation:reveal 1.4s cubic-bezier(0.16,0.9,0.28,1) forwards;
  }
  @keyframes reveal{
    to{opacity:1;filter:blur(0);transform:translateY(0);}
  }

  .script-word{
    font-family:'Playfair Display',serif;font-style:italic;font-weight:700;
    font-size:clamp(2.2rem,7vw,4rem);letter-spacing:1px;
    background:linear-gradient(180deg,var(--cream) 0%,var(--gold) 55%,#c99a45 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 22px rgba(244,213,141,0.55));
  }

  .divider{
    display:flex;align-items:center;justify-content:center;gap:12px;
    opacity:0;animation:fadeIn 1.2s ease forwards;
    margin:10px 0;
  }
  .divider .rule{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
  .divider .dot{width:6px;height:6px;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 10px var(--gold);}
  @keyframes fadeIn{to{opacity:1;}}

  .name-word{
    font-family:'Poppins',sans-serif;font-weight:900;text-transform:uppercase;
    font-size:clamp(2.6rem,10vw,6rem);letter-spacing:6px;margin-top:6px;
    background:linear-gradient(100deg,#c99a45 0%,var(--cream) 20%,var(--gold-bright) 40%,#c99a45 60%,var(--cream) 80%,var(--gold-bright) 100%);
    background-size:250% auto;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 28px rgba(255,233,176,0.5));
    animation:reveal 1.6s cubic-bezier(0.16,0.9,0.28,1) forwards, shimmer 5s linear infinite 2.4s;
  }
  @keyframes shimmer{
    to{background-position:-250% center;}
  }

  .float{animation-name: floaty; animation-duration:5.5s; animation-timing-function:ease-in-out; animation-iteration-count:infinite; animation-direction:alternate;}
  @keyframes floaty{
    0%{transform:translateY(0);}
    100%{transform:translateY(-8px);}
  }
</style>
</head>
<body>

<div class="creator-screen" id="creator-ui">
  <div class="glass-box">
    <div class="eyebrow">Assam · Live Fireworks</div>
    <h2>Create a Birthday Wish</h2>
    <input type="text" id="name-input" placeholder="Enter a name..." />
    <button onclick="generateLink()">Create Link</button>
    <div id="link-result">
      <input type="text" id="generated-url" readonly />
      <button onclick="copyLink()" style="margin-top:8px;">Copy Link</button>
    </div>
  </div>
</div>

<div id="wish-stage">
  <div class="line"><span class="word script-word" id="w1" style="animation-delay:.2s;">Happy</span></div>
  <div class="divider" id="d1" style="animation-delay:1.5s;"><span class="rule"></span><span class="dot"></span><span class="rule"></span></div>
  <div class="line"><span class="word script-word" id="w2" style="animation-delay:1.7s;">Birthday</span></div>
  <div class="line"><span class="name-word" id="name-display" style="animation-delay:3.1s;">NAME</span></div>
</div>

<div id="webgl-container"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');
  if (name) {
    document.getElementById('creator-ui').style.display = 'none';
    document.getElementById('wish-stage').style.display = 'block';
    document.getElementById('name-display').innerText = decodeURIComponent(name);

    setTimeout(() => {
      document.querySelectorAll('.word').forEach(el => el.classList.add('float'));
    }, 4800);

    initScene();
  }
});

function generateLink() {
  const val = document.getElementById('name-input').value.trim();
  if (!val) { alert('Please enter a name!'); return; }
  const base = window.location.href.split('?')[0];
  const url = `${base}?name=${encodeURIComponent(val)}`;
  document.getElementById('generated-url').value = url;
  document.getElementById('link-result').style.display = 'block';
}
function copyLink() {
  const el = document.getElementById('generated-url');
  el.select();
  document.execCommand('copy');
  alert('Link copied!');
}

/* ================= THREE.JS SCENE ================= */
function initScene() {
  const container = document.getElementById('webgl-container');

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x03010a, 0.0075);

  const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 1000);
  camera.position.set(0, 14, 92);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x1a0f33, 1.1));
  const moon = new THREE.DirectionalLight(0x7d92ff, 1.1);
  moon.position.set(0, 100, -50);
  scene.add(moon);

  function makeGlowTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.25, 'rgba(255,255,255,0.9)');
    g.addColorStop(0.6, 'rgba(255,255,255,0.25)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }
  const glowTex = makeGlowTexture();

  const mGeo = new THREE.PlaneGeometry(300, 100, 90, 40);
  const mPos = mGeo.attributes.position;
  for (let i = 0; i < mPos.count; i++) {
    const x = mPos.getX(i), y = mPos.getY(i);
    let z = Math.sin(x * 0.05) * Math.cos(y * 0.08) * 18 + Math.sin(x * 0.1) * 8;
    if (y < -10) z *= 0.2;
    mPos.setZ(i, z);
  }
  mGeo.computeVertexNormals();
  const mountain = new THREE.Mesh(mGeo, new THREE.MeshStandardMaterial({ color: 0x0b0620, roughness: 0.9, metalness: 0.1, flatShading: true }));
  mountain.position.set(0, 12, -40);
  mountain.rotation.x = -Math.PI * 0.05;
  scene.add(mountain);

  const wGeo = new THREE.PlaneGeometry(300, 120, 60, 60);
  const water = new THREE.Mesh(wGeo, new THREE.MeshStandardMaterial({ color: 0x02040f, roughness: 0.15, metalness: 0.75 }));
  water.rotation.x = -Math.PI / 2;
  water.position.set(0, -15, 20);
  scene.add(water);

  const starGeo = new THREE.BufferGeometry();
  const starCount = 1000;
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount * 3; i += 3) {
    starPos[i] = (Math.random() - 0.5) * 400;
    starPos[i + 1] = Math.random() * 150 + 10;
    starPos[i + 2] = (Math.random() - 0.5) * 200 - 50;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, map: glowTex, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false })));

  const FIREWORK_COLORS = [0xffd27f, 0xff6b35, 0xff2d55, 0x4da6ff, 0x36d399, 0xffffff];
  let rockets = [];
  let trailSparks = [];
  let bursts = [];

  class Rocket {
    constructor() {
      this.x = (Math.random() - 0.5) * 110;
      this.z = (Math.random() - 0.5) * 30 - 10;
      this.y = -14.5;
      this.targetY = Math.random() * 20 + 26;
      this.vy = Math.random() * 0.55 + 1.05;
      this.color = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
      this.tick = 0;

      this.mat = new THREE.SpriteMaterial({ map: glowTex, color: 0xfff2c8, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
      this.sprite = new THREE.Sprite(this.mat);
      this.sprite.scale.set(1.1, 1.1, 1);
      this.sprite.position.set(this.x, this.y, this.z);
      scene.add(this.sprite);

      this.light = new THREE.PointLight(0xffdca8, 2.2, 26);
      this.light.position.copy(this.sprite.position);
      scene.add(this.light);
    }
    update() {
      this.vy -= 0.018;
      this.y += this.vy;
      this.sprite.position.y = this.y;
      this.light.position.y = this.y;

      this.tick++;
      if (this.tick % 2 === 0) trailSparks.push(new TrailSpark(this.x, this.y, this.z));

      if (this.vy <= 0.05 || this.y >= this.targetY) {
        scene.remove(this.sprite); this.mat.dispose();
        scene.remove(this.light);
        bursts.push(new Burst(this.x, this.y, this.z, this.color));
        return false;
      }
      return true;
    }
  }

  class TrailSpark {
    constructor(x, y, z) {
      this.mat = new THREE.SpriteMaterial({ map: glowTex, color: 0xffcf8f, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false });
      this.sprite = new THREE.Sprite(this.mat);
      this.sprite.scale.set(0.5, 0.5, 1);
      this.sprite.position.set(x, y, z);
      scene.add(this.sprite);
      this.life = 1;
    }
    update() {
      this.life -= 0.07;
      this.mat.opacity = Math.max(this.life * 0.7, 0);
      this.sprite.position.y -= 0.025;
      if (this.life <= 0) { scene.remove(this.sprite); this.mat.dispose(); return false; }
      return true;
    }
  }

  class Burst {
    constructor(x, y, z, colorHex) {
      const crackle = Math.random() < 0.3;
      const count = crackle ? 90 : 150;
      this.colorHex = crackle ? 0xffffff : colorHex;
      this.seed = Math.random() * 10;

      this.light = new THREE.PointLight(this.colorHex, 9, 110);
      this.light.position.set(x, y, z);
      scene.add(this.light);

      this.geometry = new THREE.BufferGeometry();
      this.positions = new Float32Array(count * 3);
      this.velocities = [];
      for (let i = 0; i < count; i++) {
        this.positions[i * 3] = x;
        this.positions[i * 3 + 1] = y;
        this.positions[i * 3 + 2] = z;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(Math.random() * 2 - 1);
        const speed = (crackle ? Math.random() * 1.5 + 0.6 : Math.random() * 1.05 + 0.35);
        this.velocities.push({
          x: Math.sin(phi) * Math.cos(theta) * speed,
          y: Math.sin(phi) * Math.sin(theta) * speed,
          z: Math.cos(phi) * speed
        });
      }
      this.geometry.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
      this.material = new THREE.PointsMaterial({
        color: this.colorHex, map: glowTex, size: crackle ? 1.1 : 1.6,
        transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false
      });
      this.mesh = new THREE.Points(this.geometry, this.material);
      scene.add(this.mesh);

      this.life = 1.0;
      this.decay = crackle ? (Math.random() * 0.02 + 0.02) : (Math.random() * 0.011 + 0.009);
      this.time = 0;
    }
    update() {
      this.time += 0.06;
      this.life -= this.decay;
      const twinkle = 0.75 + 0.25 * Math.sin(this.time * 9 + this.seed);
      this.material.opacity = Math.max(this.life * twinkle, 0);
      this.light.intensity = Math.max(this.life * 8 * twinkle, 0);

      const pos = this.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const v = this.velocities[i];
        v.x *= 0.985; v.z *= 0.985;
        v.y = v.y * 0.985 - 0.02;
        pos.setXYZ(i, pos.getX(i) + v.x, pos.getY(i) + v.y, pos.getZ(i) + v.z);
      }
      pos.needsUpdate = true;

      if (this.life <= 0) {
        scene.remove(this.mesh); scene.remove(this.light);
        this.geometry.dispose(); this.material.dispose();
        return false;
      }
      return true;
    }
  }

  setInterval(() => { rockets.push(new Rocket()); }, 650);

  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    const wp = wGeo.attributes.position;
    for (let i = 0; i < wp.count; i++) {
      const u = wp.getX(i), v = wp.getY(i);
      wp.setZ(i, Math.sin(u * 0.1 + t * 2) * Math.cos(v * 0.1 + t * 1.5) * 0.8);
    }
    wGeo.computeVertexNormals();
    wp.needsUpdate = true;

    rockets = rockets.filter(r => r.update());
    trailSparks = trailSparks.filter(s => s.update());
    bursts = bursts.filter(b => b.update());

    camera.position.x = Math.sin(t * 0.3) * 2;
    camera.position.y = 15 + Math.cos(t * 0.4) * 1;
    camera.lookAt(0, 15, 0);

    renderer.render(scene, camera);
  }
  animate();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}
</script>
</body>
</html>
