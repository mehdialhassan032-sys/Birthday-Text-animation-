<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grand Celebration</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Arial', sans-serif; }
        canvas { display: block; }

        /* UI Styling */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.85); z-index: 100;
        }
        .card {
            background: #111; padding: 40px; border-radius: 20px;
            text-align: center; border: 1px solid #444; color: white;
            box-shadow: 0 0 30px rgba(255,215,0,0.2);
        }
        input { 
            padding: 12px; width: 250px; border-radius: 8px; border: none; 
            margin-bottom: 20px; font-size: 1rem;
        }
        button { 
            padding: 12px 25px; border-radius: 8px; border: none; 
            background: #ffd700; font-weight: bold; cursor: pointer; 
        }
        #link-box { display: none; margin-top: 20px; }
        #share-url { background: #222; color: #0f0; padding: 10px; width: 300px; border: none; }
    </style>
</head>
<body>

<!-- Setup Screen -->
<div id="ui-layer">
    <div class="card">
        <h1>✨ Create Celebration</h1>
        <input type="text" id="name-input" placeholder="Enter Name...">
        <br>
        <button onclick="generateLink()">Create Link</button>
        
        <div id="link-box">
            <p>Copy this link:</p>
            <input type="text" id="share-url" readonly>
            <button onclick="copyLink()">Copy</button>
        </div>
    </div>
</div>

<canvas id="fireworks"></canvas>

<script>
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    let particles = [];

    // --- URL PARAMETER LOGIC ---
    const urlParams = new URLSearchParams(window.location.search);
    const nameParam = urlParams.get('name');

    if (nameParam) {
        document.getElementById('ui-layer').style.display = 'none';
        startCelebration(nameParam);
    }

    function generateLink() {
        const name = document.getElementById('name-input').value;
        if(!name) return alert("Please enter a name");
        const url = window.location.origin + window.location.pathname + "?name=" + encodeURIComponent(name);
        document.getElementById('share-url').value = url;
        document.getElementById('link-box').style.display = 'block';
    }

    function copyLink() {
        document.getElementById('share-url').select();
        document.execCommand('copy');
        alert("Link copied!");
    }

    // --- REALISTIC PHYSICS ENGINE ---
    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.color = color;
            this.angle = Math.random() * Math.PI * 2;
            this.velocity = Math.random() * 6 + 2;
            this.vx = Math.cos(this.angle) * this.velocity;
            this.vy = Math.sin(this.angle) * this.velocity;
            this.gravity = 0.12; // Realistic drop
            this.friction = 0.95; // Air resistance
            this.alpha = 1;
            this.decay = Math.random() * 0.015 + 0.01;
        }
        update() {
            this.vx *= this.friction;
            this.vy *= this.friction;
            this.vy += this.gravity;
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= this.decay;
        }
        draw() {
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function startCelebration(name) {
        // Text Effect
        const drawText = () => {
            ctx.fillStyle = "white";
            ctx.font = "bold 60px Arial";
            ctx.textAlign = "center";
            ctx.fillText("Happy Birthday", canvas.width/2, canvas.height/2 - 50);
            ctx.fillStyle = "#ffd700";
            ctx.fillText(name, canvas.width/2, canvas.height/2 + 50);
        };

        // Animation Loop
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; // Motion blur trail
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Randomly spawn fireworks
            if(Math.random() < 0.05) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height * 0.5;
                const color = `hsl(${Math.random() * 360}, 100%, 60%)`;
                for(let i=0; i<80; i++) particles.push(new Particle(x, y, color));
            }

            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if(p.alpha <= 0) particles.splice(index, 1);
            });

            drawText();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        animate();
    }
</script>
</body>
</html>
