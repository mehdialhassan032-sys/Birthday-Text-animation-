<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Birthday Surprise 🎉</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Fredoka+One&family=Poppins:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #05020a; font-family: 'Poppins', sans-serif; color: #fff; }

        /* Generator UI Overlay */
        #creator-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; background: radial-gradient(circle, #2d0b3f 0%, #05020a 100%);
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px);
            padding: 35px 25px; border-radius: 24px; border: 1.5px solid rgba(255, 215, 0, 0.5);
            text-align: center; width: 90%; max-width: 400px;
            box-shadow: 0 0 50px rgba(255, 0, 127, 0.4);
        }

        .glass-box h2 { 
            font-family: 'Cinzel Decorative', cursive; color: #ffd700; margin-bottom: 20px; font-size: 1.6rem;
            text-shadow: 0 0 10px rgba(255,215,0,0.6);
        }
        
        .glass-box input {
            width: 100%; padding: 14px; border-radius: 30px; border: 2px solid #ff007f;
            background: rgba(0,0,0,0.7); color: #fff; font-size: 1.1rem; text-align: center; outline: none; margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(45deg, #ff007f, #ff7700, #ffd700);
            color: #fff; border: none; padding: 13px 30px; font-size: 1rem; font-weight: 700;
            border-radius: 30px; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.5);
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(255, 215, 0, 0.9); }

        #link-result { margin-top: 20px; display: none; }
        #generated-url { width: 100%; padding: 10px; background: #11081f; border: 1px solid #00ffcc; color: #00ffcc; border-radius: 10px; margin-bottom: 10px; font-size: 0.85rem; word-break: break-all; }

        /* Animation Canvas & Container */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        canvas { display: block; width: 100%; height: 100%; }

        /* Animated Glowing Text Container */
        #wish-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; text-align: center; width: 90%; pointer-events: none;
            display: none;
        }

        .animated-title {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(2.2rem, 8vw, 4.5rem);
            background: linear-gradient(45deg, #ffd700, #ff7700, #ff007f, #00ffff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 3s infinite alternate, floatWave 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 0, 127, 0.6);
            letter-spacing: 2px;
        }

        .animated-name {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(3rem, 12vw, 6rem);
            color: #ffffff;
            text-shadow: 
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #ff007f,
                0 0 80px #ff007f;
            animation: pulseGlow 1.8s infinite alternate, floatWave 3.5s ease-in-out infinite 0.5s;
            margin-top: 10px;
            text-transform: uppercase;
        }

        /* Continuous Animations */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes floatWave {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-20px) rotate(2deg) scale(1.03); }
            100% { transform: translateY(0px) rotate(-2deg) scale(1); }
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #ff007f; }
            100% { text-shadow: 0 0 20px #ffd700, 0 0 40px #ff007f, 0 0 90px #ff007f; }
        }

        /* Tap Prompt */
        #music-prompt {
            position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%);
            z-index: 50; background: rgba(255,255,255,0.12); backdrop-filter: blur(10px); 
            padding: 12px 25px; border-radius: 30px; border: 1px solid #ffd700; 
            font-size: 0.85rem; font-weight: 700; color: #ffd700;
            letter-spacing: 1px; animation: pulseBtn 1.2s infinite alternate;
            display: none; text-align: center; cursor: pointer;
        }

        @keyframes pulseBtn {
            0% { opacity: 0.7; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }
    </style>
</head>
<body>

    <div id="creator-ui">
        <div class="glass-box">
            <h2>Birthday Wish Generator 🎉</h2>
            <input type="text" id="name-input" placeholder="Enter Name..." />
            <button class="btn" onclick="generateLink()">Create Magic Link 🚀</button>

            <div id="link-result">
                <input type="text" id="generated-url" readonly />
                <button class="btn" onclick="copyLink()">Copy Magic Link 📋</button>
            </div>
        </div>
    </div>

    <div id="wish-container">
        <div class="animated-title">HAPPY BIRTHDAY</div>
        <div class="animated-name" id="display-name">NAME</div>
    </div>

    <div id="music-prompt">✨ TAP ANYWHERE FOR FIREWORKS ✨</div>
    
    <div id="canvas-container">
        <canvas id="fireworksCanvas"></canvas>
    </div>

    <script>
        const nameParam = new URLSearchParams(window.location.search).get('name');

        if (nameParam) {
            document.getElementById('creator-ui').style.display = 'none';
            document.getElementById('wish-container').style.display = 'block';
            document.getElementById('music-prompt').style.display = 'block';
            document.getElementById('display-name').innerText = decodeURIComponent(nameParam);
            initFireworks();
        }

        function generateLink() {
            let name = document.getElementById('name-input').value.trim();
            if(!name) { alert("Please enter a name!"); return; }
            
            let baseUrl = window.location.href.split('?')[0];
            let shareableUrl = `${baseUrl}?name=${encodeURIComponent(name)}`;
            
            document.getElementById('generated-url').value = shareableUrl;
            document.getElementById('link-result').style.display = 'block';
        }

        function copyLink() {
            let copyText = document.getElementById('generated-url');
            copyText.select();
            document.execCommand("copy");
            alert("Magic Link Copied! Share it with the Birthday Person 🎉");
        }

        // --- ULTRA SMOOTH 2D CANVAS FIREWORKS & ROCKET SYSTEM ---
        function initFireworks() {
            const canvas = document.getElementById('fireworksCanvas');
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            let particles = [];
            let rockets = [];

            class Rocket {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height;
                    this.targetY = Math.random() * (canvas.height * 0.5) + 50;
                    this.speed = Math.random() * 4 + 7;
                    this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
                }
                update() {
                    this.y -= this.speed;
                    if (this.y <= this.targetY) {
                        createExplosion(this.x, this.y, this.color);
                        return false;
                    }
                    return true;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
            }

            class Particle {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 6 + 1;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.alpha = 1;
                    this.decay = Math.random() * 0.02 + 0.015;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.05; // Gravity
                    this.alpha -= this.decay;
                    return this.alpha > 0;
                }
